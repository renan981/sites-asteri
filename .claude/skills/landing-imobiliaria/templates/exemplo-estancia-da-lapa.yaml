faq:
  - { pergunta: "Onde fica o Estância da Lapa?", resposta: "Na região da Quinta do Sumidouro, em Fidalgo, distrito de Pedro Leopoldo, com acesso estratégico pela MG-424." }
  - { pergunta: "Qual é o tamanho das glebas?", resposta: "As unidades possuem área a partir de 20.000 m², permitindo projetos com maior liberdade de implantação e uso." }
  - { pergunta: "O condomínio é regularizado?", resposta: "Sim. A documentação específica e as condições de cada unidade são detalhadas durante o atendimento." }
  - { pergunta: "Como conhecer as unidades disponíveis?", resposta: "Preencha o formulário para receber a apresentação, consultar disponibilidade e agendar uma visita acompanhada." }
  - { pergunta: "Posso utilizar a gleba como segunda residência?", resposta: "Sim. As dimensões permitem projetos de moradia principal, segunda residência, lazer ou outras finalidades compatíveis com as regras do condomínio." }
  - { pergunta: "Qual é o valor das glebas?", resposta: "As glebas disponíveis partem de R$ 467 mil (gleba D-55, com 20.110 m²). Cada unidade tem valor próprio." }
  - { pergunta: "Quais são as formas de pagamento?", resposta: "Dois planos curtos sem juros (10% + 48 parcelas ou 20% + 60 parcelas) e o plano tradicional, com entrada e até 210 parcelas." }

